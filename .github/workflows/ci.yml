name: Continuous Integration

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests (Karma)
        env:
          CI: true
        run: npm test

      - name: Build application (Production)
        run: npm run build

      - name: Run E2E tests (Playwright)
        env:
          CI: true
        run: npm run e2e

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: dist/chat/browser
          retention-days: 7

  docker-build:
    name: Docker Build & Verification
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t iggi-chat:${{ github.sha }} .

      - name: Test Docker container run
        run: |
          docker run -d --name test-app -p 8080:80 iggi-chat:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:8080/ || (docker logs test-app && exit 1)
          docker rm -f test-app
