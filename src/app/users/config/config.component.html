<div class="row" style="margin-top: 100px;">
  <div class="col-10 offset-1">
    <div class="row">
      <div class="col-lg-4 col-md-4 col-sm-12 col-12">
        <div class="card effect">
          <div class="card-header">
            <h3 class="card-title">Donnees personnelles</h3>
          </div>
          <div class="card-body">
            <div *ngIf="loadingDonneesPerso" style="width: 100%; height: 100%; text-align: center;" class="example-section">
              <mat-progress-bar mode="indeterminate"></mat-progress-bar>
            </div>

            <span [ngStyle]="{'color':succesResponseDonneesPerso?'green':'red'}">{{messageDonneesPerso}}</span>


            <form [formGroup]="donneesPersoFormGroup">
              <div class="field-container">
                <mat-form-field>
                  <input matInput formControlName="firstname" placeholder="E-Mail"  [formControl]="firstname" type="text" required autocomplete="off" >
                </mat-form-field>
                <mat-form-field>
                  <input matInput formControlName="lastname" placeholder="E-Mail"  [formControl]="lastname" type="text" required autocomplete="off" >
                </mat-form-field>

              </div>
              <div>
                <button  class="btn  btn-primary float-end" (click)="updateDonneesPerso();" >Modifier</button>
              </div>
            </form>

          </div>
        </div>
      </div>

      <div class="col-lg-4 col-md-4 col-sm-12 col-12">
        <div class="card effect">
          <div class="card-header">
            <h3 class="card-title">Modifier Votre Mot de Passe</h3>
          </div>
          <div class="card-body">
            <div *ngIf="loadingChangePwd" style="width: 100%; height: 100%; text-align: center;" class="example-section">
              <mat-progress-bar mode="indeterminate"></mat-progress-bar>
            </div>

            <span [ngStyle]="{'color':succesResponseChangePwd?'green':'red'}">{{messageChangePwd}}</span>


            <form [formGroup]="changePwdFormGroup">
              <div class="field-container">
                <mat-form-field>
                  <input matInput formControlName="currentpassword" placeholder="Mot de Passe courant"  [formControl]="currentpassword" type="password" required autocomplete="off">
                </mat-form-field>
                <mat-form-field>
                  <input matInput formControlName="newpassword" placeholder="Nouveau Mot de passe"  [formControl]="newpassword" type="password" required autocomplete="off">
                </mat-form-field>
                <mat-form-field>
                  <input matInput formControlName="newpassword_confirmation" placeholder="Confirmer Nouveau Mot de passe"  [formControl]="newpassword_confirmation" type="password" required autocomplete="off">
                </mat-form-field>
              </div>
              <div>
                <button  class="btn  btn-primary float-end" (click)="updatePwd();" >Modifier</button>
              </div>
            </form>

          </div>
        </div>
      </div>

    </div>
  </div>
</div>
