<mat-card-header >
  <img mat-card-avatar src="{{photoUrl}}" />
  <mat-card-title>{{user.firstname + '  ' + user.lastname}}</mat-card-title>
  <mat-card-subtitle>{{user.email}} | {{countryName}} </mat-card-subtitle>
</mat-card-header>
<mat-card-content>
  <p>
    <!--<img src="../../../assets/img/{{genderimg}}" height="20" width="20"/>    | -->
    <a class="btn btn-link  float-left" (click)="proposeAsAdmin(user.userid)" style="color: darkblue;" *ngIf="isAdmin">Proposer Comme Administrateur</a>
    <a [routerLink]="['/user-details', user.userid]" class="btn btn-link  float-right">Deatails</a>
  </p>
  <br>
<!--
  <div class="{{user.isconnected==0?'alert-danger':'alert-success'}}">{{user.isconnected==0?'Deconnecte':'Connecte'}}</div>
-->
  <div *ngIf="loading" style="width: 100%; height: 100%; text-align: center;" class="example-section">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  </div>
  <span [ngStyle]="{'color':succesResponse?'green':'red'}">{{message}}</span>
  <br>
</mat-card-content>

  <!--</div>
</div>-->
