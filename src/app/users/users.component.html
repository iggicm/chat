<section id="team" class="pb-5">
  <mat-tab-group>
    <mat-tab>
      <ng-template mat-tab-label>
        <!--<mat-icon class="example-tab-icon">thumb_up</mat-icon>-->

        <i class="material-icons">
          person
        </i>
      </ng-template>

      <div class="row example-large-box mat-elevation-z4">
        <br>
        <div class="col-12">
          <div class="row">

            <div class="col-md-12 text-center">
              <br>
              <h3 class="list-title">Listes Membres Adherents de IGGI</h3>
            </div>

            <div class="col-md-12 text-center">
              <div *ngIf="loading" style="width: 100%; height: 100%; text-align: center;" class="example-section">
                <!--<mat-spinner style="height: 25px; width: 25px;" aria-label="Veuillez patienter s'il vous plait" [diameter]="45" [ngStyle]="{
            'margin':'auto'
            }"></mat-spinner>-->
                <mat-progress-bar mode="indeterminate"></mat-progress-bar>
              </div>
            </div>


            <div class="col-xs-12 col-sm-6 col-md-3" *ngFor="let u of users" >
              <mat-card  [ngStyle]="{'border':(u.temoins == null || u.temoins.revoked == true)?'1px red solid':'1px green solid'}" >
                <span matBadge="N" matBadgeColor="warn" matBadgeOverlap="false" class="float-right" *ngIf="(u.temoins == null || u.temoins.revoked == true)">Statut</span>
                <span matBadge="Y" matBadgeColor="primary" matBadgeOverlap="false" class="float-right" *ngIf="!(u.temoins == null || u.temoins.revoked == true)">Statut</span>

                <app-user  [user]="u" (userAccepted)="removeUserFromList($event)"></app-user>
              </mat-card>
            </div>

          </div>
        </div>
      </div>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <!--<mat-icon class="example-tab-icon">thumb_up</mat-icon>-->
        <i class="material-icons">
          person_pin_circle
        </i>
      </ng-template>
      <div class="row example-large-box mat-elevation-z4">
        <br>
        <agm-map [latitude]="lat" [longitude]="lng" >
          <agm-marker *ngFor="let user of users; let i=index;" [latitude]="user.latitude + i+5" [longitude]="user.longitude + i + 3"></agm-marker>
        </agm-map>
      </div>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="example-tab-icon">thumb_up</mat-icon>
        Membre connecte
      </ng-template>

      Content 3
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="example-tab-icon">thumb_up</mat-icon>
        Carte Membre connecte
      </ng-template>

      Carte membre connectes
    </mat-tab>
  </mat-tab-group>
  <!--</div>-->
</section>
