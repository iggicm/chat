<div class="container" style="margin-top: 100px;">
  <div class="row">
    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12 offset-3">
      <div class="card effect">
        <div class="card-header">
          <h3 class="card-title">Connexion</h3>
        </div>
        <div class="card-body">
          <div *ngIf="loading" style="width: 100%; height: 100%; text-align: center;" class="example-section">
            <!--<mat-spinner style="height: 25px; width: 25px;" aria-label="Veuillez patienter s'il vous plait" [diameter]="45" [ngStyle]="{
            'margin':'auto'
            }"></mat-spinner>-->
            <mat-progress-bar mode="indeterminate"></mat-progress-bar>
          </div>
          <form [formGroup]="loginFormGroup">
            <div class="field-container">

              <div class="{{error?'alert-denger':''}}" *ngIf="error" style="color: red;">
                <span class="elementor-align-center" *ngIf="error">{{message}}</span>
              </div>
              <mat-form-field>
                <input matInput formControlName="email" placeholder="E-Mail"  [formControl]="email" type="email" required autocomplete="off" [value]="oldEmail">
              </mat-form-field>
              <mat-form-field>
                <input matInput formControlName="password" placeholder="Mot de Passe"  [formControl]="password" type="password" required autocomplete="off">
                <input   formControlName="latitude"  placeholder="latitude" [style.display]="displayNone()" [formControl]="latitude">
                <input   formControlName="longitude"  placeholder="Longitude" [style.display]="displayNone()" [formControl]="longitude">
              </mat-form-field>
            </div>
            <div>
              <button  class="btn  btn-primary float-right" (click)="submit();" >Connexion</button>
            </div>
          </form>
          <br><br>
          <a href="#" class="btn btn-link float-left" [routerLink]="['../password-reset-request']">Mot de passe oublie</a>
        </div>
      </div>
    </div>

  </div>
</div>
