<div class="container" style="margin-top: 200px;">
  <div class="row">
    <div class="col-lg-8 col-md-8 col-sm-12 col-12 offset-2">
      <div class="card effect">
        <div class="card-header">
          <h3 class="card-title">Demande de configuration de Mot de passe</h3>
        </div>
        <div class="card-body">
          <div *ngIf="loading" style="width: 100%; height: 100%; text-align: center;" class="example-section">
            <mat-spinner style="height: 25px; width: 25px;" aria-label="Veuillez patienter s'il vous plait" [diameter]="45" [ngStyle]="{
            'margin':'auto'
            }"></mat-spinner>
          </div>
          <form [formGroup]="passwordResetRequestFormGroup">
            <div class="field-container">
              <div class="{{error?'alert-denger':''}}" *ngIf="error" style="color: red;">
                <span class="elementor-align-center" *ngIf="error">{{message}}</span>
              </div>
              <mat-form-field>
                <input matInput formControlName="email" placeholder="E-Mail"  [formControl]="email" type="email" required autocomplete="off" [value]="">
              </mat-form-field>
            </div>
            <div>
              <button  class="btn  btn-primary float-end" (click)="submit();" >Demander la configuration</button>
            </div>
          </form>
          <br><br>
          <a href="#" class="btn btn-link float-start" [routerLink]="['../login']">Se connecter</a>
        </div>
      </div>
    </div>

  </div>
</div>
