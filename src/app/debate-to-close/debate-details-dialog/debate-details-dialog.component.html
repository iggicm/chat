<div class="container" [class.layout-column]="true" [class.layout-evenly]="true">
  <h1 mat-dialog-title>{{'Details du debat '}} <strong>{{debate.theme}}</strong></h1>
  <div *ngIf="loading" style="width: 100%; height: 100%; text-align: center;" class="example-section">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  </div>
  <span [ngStyle]="{'color':successResponse?'green':'red'}">{{message}}</span>
  <br>
  <div>
    <!--<button [disabled]="uploading || uploadSuccessful" mat-raised-button color="primary" class="add-files-btn" (click)="addFiles()">
      Add Files
    </button>-->
  </div>

  <!-- This is the content of the dialog, containing a list of the files to upload -->
  <mat-dialog-content [class.layout-flex]="true">

    <div class="row">
      <div class="col-md-8">
        <ul *ngFor="let comment of comments" class="list-group" >
          <li class="list-group-item {{comment.authorid==userId?'active':''}}">
            <p>{{comment.textbody}}</p>
            <!--<ul class="list-group" *ngIf="transformeToArray(comment.files).length>0">
              <li class="list-group-item" *ngFor="let f of transformeToArray(comment.files); let i = index">
                <button class="btn btn-link" (click)="popupFile(comment.commentid, f)">{{'Fichier - ' + (i +1)}} </button>
              </li>
            </ul>-->
            <span style="font-size: x-small; float: left;">{{comment.authorname}}</span>
            <span class="float-end" *ngIf="comment.sent"><mat-icon class="example-tab-icon">done_all</mat-icon></span>
            <span class="float-end" *ngIf="!comment.sent"><mat-icon class="example-tab-icon">check</mat-icon></span>
            <br><span class="float-end">{{comment.created_at}}</span>
          </li>
        </ul>
      </div>
      <div class="col-md-4">
        <div class="row">
          <div class="col-md-2" *ngFor="let f of files">
            {{f}}
          </div>
        </div>
      </div>
    </div>



    <!--<mat-list>
      <mat-list-item *ngFor="let file of files">
        <h4 matListItemLine>{{file.name}}</h4>
        <mat-progress-bar *ngIf="progress" mode="determinate" [value]="progress[file.name].progress | async"></mat-progress-bar>
      </mat-list-item>
    </mat-list>-->
    content
  </mat-dialog-content>

  <!-- This are the actions of the dialog, containing the primary and the cancel button-->
  <mat-dialog-actions class="actions">
    <button  mat-button mat-dialog-close class="float-start">Fermer</button>
    <!--<button *ngIf="showCancelButton" mat-button mat-dialog-close>Cancel</button>-->
    <button mat-raised-button color="primary"  (click)="closeDialog()">Fermer</button>
  </mat-dialog-actions>
</div>
