<div class="container" style="margin-top: 100px; margin-bottom: 120px;">
  <div class="row">
    <div class="col-lg-8 col-md-8 col-sm-12 col-xs-12 offset-2">
      <div class="card effect">
        <div class="card-header">
          <h3 class="card-title">Demande d’Adhésion</h3>
        </div>
        <div class="card-body">

          <form [formGroup]="applicationFormGroup" >
            <div class="field-container">
              <div class="{{error?'alert-denger':''}}" *ngIf="error" style="{{error?'color: red;':'color: green;'}}">
                <span class="elementor-align-center" *ngIf="error">{{message}}</span>
              </div>

              <mat-form-field>
                <input matInput formControlName="firstname" placeholder="Nom"  [formControl]="firstname" type="text" required autocomplete="off" [value]="">
              </mat-form-field>

              <mat-form-field>
                <input matInput formControlName="lastname" placeholder="Prenom"  [formControl]="lastname" type="text" required autocomplete="off" [value]="">
              </mat-form-field>

              <mat-form-field>
                <mat-select placeholder="Sexe" formControlName="gender" required >
                  <mat-option *ngFor="let gender of genders" [value]="gender.value">
                    {{gender.viewValue}}
                  </mat-option>
                </mat-select>
              </mat-form-field>

              <!--<mat-form-field>-->

              <label for="photo" style="">Photo</label>
              <input type="file" id="photo" (change)="onSelectFile($event)" #photo style="display: none;" required formControlName="photo">
              <mat-form-field [ngStyle]="{'margin-top':'-20px'}">
                <input matInput formControlName="filename" placeholder="" readonly [formControl]="filename" (click)="selectFile()">
              </mat-form-field>


              <mat-form-field>
                <mat-select placeholder="Pays de residence" formControlName="country" required >
                  <mat-option *ngFor="let country of countries" [value]="country.code">
                    {{country.name}}
                  </mat-option>
                </mat-select>
              </mat-form-field>


              <mat-form-field class="example-full-width">
                <input type="text" formControlName="cityofresidency" placeholder="Ville de residence" aria-label="Number" matInput [formControl]="cityofresidency" [matAutocomplete]="auto_cityofresidency">
                <mat-autocomplete #auto_cityofresidency="matAutocomplete">
                  <mat-option *ngFor="let option of cityofresidencies" [value]="option">
                    {{option}}
                  </mat-option>
                </mat-autocomplete>
              </mat-form-field>

              <mat-form-field class="example-full-width">
                <input type="text" formControlName="interestcenter" placeholder="Centre d'interet" aria-label="Number" matInput [formControl]="interestcenter" [matAutocomplete]="auto_interestcenter">
                <mat-autocomplete #auto_interestcenter="matAutocomplete">
                  <mat-option *ngFor="let option of interestcenters" [value]="option.name">
                    {{option.name}}
                  </mat-option>
                </mat-autocomplete>
              </mat-form-field>


              <mat-form-field>
                <input matInput formControlName="email" placeholder="E-Mail"  [formControl]="email" type="email" required autocomplete="off" [value]="">
              </mat-form-field>

              <mat-form-field>
                <input matInput formControlName="phone" placeholder="Telephone"  [formControl]="phone" type="text" required autocomplete="off" [value]="">
              </mat-form-field>

              <mat-form-field>
                  <textarea matInput placeholder="Commentaire" formControlName="commenttotheregistration" required  autocomplete="off" rows="5"
                            [formControl]="commenttotheregistration"></textarea>
              </mat-form-field>
              <input   formControlName="latitude"  placeholder="latitude" [style.display]="displayNone()" [formControl]="latitude">
              <input   formControlName="longitude"  placeholder="Longitude" [style.display]="displayNone()" [formControl]="longitude">
            </div>
            <div>
              <button  class="btn  btn-primary float-right" (click)="submit();" >Postuler</button>
              <br> <br>

              <div *ngIf="!loading" style="width: 100%; height: 100%; text-align: center;" class="example-section">
                <p *ngIf="success">
                  <ngb-alert [dismissible]="true" [type]="successType" (close)="close()">
                    <strong>{{message}}</strong>
                  </ngb-alert>
                </p>

                <p *ngIf="faillure">
                  <ngb-alert [dismissible]="true" [type]="faillureType" (close)="close()">
                    <strong>{{message}}</strong>
                  </ngb-alert>
                </p>
              </div>
            </div>



            <div *ngIf="loading" style="width: 100%; height: 100%; text-align: center;" class="example-section">
              <!--<mat-spinner style="height: 25px; width: 25px;" aria-label="Veuillez patienter s'il vous plait" [diameter]="45" [ngStyle]="{
              'margin':'auto'
              }"></mat-spinner>-->
              <!--<p><ngb-progressbar type="info" [value]="byteLoaded">Loading <b>{{byteLoaded}} of {{byteTotal}} ({{100*byteLoaded/byteTotal}})</b>...</ngb-progressbar></p>-->

              <mat-progress-bar mode="indeterminate"></mat-progress-bar>
            </div>

          </form>
        </div>
      </div>
    </div>

  </div>
</div>

<app-footer></app-footer>
