<div class="container" style="margin-top: 100px;">
  <div class="row">
    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12 offset-3">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Configurer Votre mot de passe</h3>
        </div>
        <div class="card-body">
          <div *ngIf="loading" style="width: 100%; height: 100%; text-align: center;" class="example-section">
            <mat-progress-bar mode="indeterminate"></mat-progress-bar>
          </div>
          <span [ngStyle]="{'color':successResponse?'green':'red'}">{{message}}</span>
          <form [formGroup]="resetPasswordFormGroup">
            <div class="field-container">
              <div class="{{error?'alert-denger':''}}" *ngIf="error" style="color: red;">
                <span class="elementor-align-center" *ngIf="error">{{message}}</span>
              </div>
              <mat-form-field>
                <input matInput formControlName="newpassword" placeholder="Nouveau Mot de Passe"  [formControl]="newpassword" type="password" required autocomplete="off">
              </mat-form-field>
              <mat-form-field>
                <input matInput formControlName="newpassword_confirmation" placeholder="Repeter Nouveau Mot de Passe"  [formControl]="newpassword_confirmation" type="password" required autocomplete="off">
              </mat-form-field>
            </div>
            <div>
              <button  class="btn  btn-primary float-right" (click)="submit();" >Configurer</button>
            </div>
          </form>
          <br><br>
          <a href="#" class="btn btn-link float-left" [routerLink]="['/login']">Connexion</a>
        </div>
      </div>
    </div>

  </div>
</div>
